<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Card</title>
  <link rel="stylesheet" href="charactercard.css" />
  <script src="charactercard.js" defer></script>
</head>
<body>
  <div class="character-card">
    <img src="snortleblat.webp" alt="Snortleblat" />
    <div class="name-bar">Snortleblat</div>

    <div class="stats">
      <p><strong>Class:</strong> <span id="charClass">Swamp Beast Diplomat</span></p>
      <p><strong>Level:</strong> <span id="charLevel">5</span></p>
      <p><strong>Health:</strong> <span id="charHealth">100</span></p>
    </div>

    <div class="actions">
      <button id="attack_">Attacked</button>
      <button id="levelUp_">Level Up</button>
    </div>
  </div>
</body>
</html>
